<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/index-style.css">
  <title>Frontend Mentor | Newsletter sign-up form with success message</title>
</head>

<body>
  <form class="container">
    <div class="update-box">
      <h1>Stay updated!</h1>
      <p>Join 60,000+ product managers receiving monthly updates on:</p>

      <div class="checkboxes">
        <div class="feature">
          <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 21 21"><g fill="none"><circle cx="10.5" cy="10.5" r="10.5" fill="#FF6155"/><path stroke="#FFF" stroke-width="2" d="M6 11.381 8.735 14 15 8"/></g></svg>
          <span>Product discovery and building what matters</span>
        </div>
        
        <div class="feature">
          <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 21 21"><g fill="none"><circle cx="10.5" cy="10.5" r="10.5" fill="#FF6155"/><path stroke="#FFF" stroke-width="2" d="M6 11.381 8.735 14 15 8"/></g></svg>
          <span>Measuring to ensure updates are a success</span>
        </div>

        <div class="feature">
          <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 21 21"><g fill="none"><circle cx="10.5" cy="10.5" r="10.5" fill="#FF6155"/><path stroke="#FFF" stroke-width="2" d="M6 11.381 8.735 14 15 8"/></g></svg>
          <span>And much more!</span>
        </div>
      </div>

      <div class="email-address">
        <div class="error-message-box">
          <label for="email" class="email">Email address</label>
          <span class="error-message js-errror-message"></span>
        </div>
        <input type="email" id="email" placeholder="email@company.com">
      </div>

      <button id="subscribe">Subscribe to monthly newsletter</button>
    </div>
    <div class="image-box">
      <img src="./assets/images/illustration-sign-up-desktop.svg" alt="Newsletter illustration">
    </div>
  </form>  
  <script src="./js/home.js"></script>
</body>
</html>
